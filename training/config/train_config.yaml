# YOLOv8 Training Configuration
model: yolov8n.pt          # nano – fast to train; swap to yolov8s.pt / yolov8m.pt for better accuracy
epochs: 50
imgsz: 640
batch: 16                  # lower to 8 if GPU OOM
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 7.5
cls: 0.5
dfl: 1.5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 5.0
translate: 0.1
scale: 0.5
fliplr: 0.5
mosaic: 1.0
project: e:/Cars/training/runs
name: vehicle_yolov8
exist_ok: true
save: true
save_period: 10
patience: 20               # early stopping
workers: 4
device: ""                 # auto-detect GPU; set "cpu" to force CPU
verbose: true
